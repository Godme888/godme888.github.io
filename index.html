<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godme</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            isolation: isolate; /* 创建全局层叠上下文，确保 z-index 生效 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            background-color: #0a0a0a;
            isolation: isolate; /* 双重保险 */
        }

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        nav.scrolled {
            background: rgba(10, 10, 10, 0.95);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.1em;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 300;
            letter-spacing: 0.05em;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #d4af37;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: #d4af37;
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 100;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .hero p {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2.5rem;
            max-width: 600px;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #ffffff;
            text-decoration: none;
            font-weight: 300;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            width: fit-content;
        }

        .btn:hover {
            border-color: #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            color: #d4af37;
        }

        section {
            padding: 8rem 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-content {
            position: relative;
            z-index: 1;
        }

        .about-section {
            position: relative;
            min-height: 400px;
            display: flex;
            align-items: center;
        }

        .about-content {
            max-width: 600px;
        }

        .about-content h2 {
            font-size: 1.8rem;
            font-weight: 300;
            margin-bottom: 1.5rem;
            color: #d4af37;
        }

        .about-content p {
            font-size: 1.1rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 1rem;
        }

        .works-section {
            position: relative;
        }

        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .work-card {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .work-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.15);
        }

        .work-card-media {
            width: 120px;
            min-height: 120px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        .work-card-media img,
        .work-card-media video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .work-card-media .placeholder-icon {
            color: #555;
            font-size: 24px;
        }

        .work-card-content {
            flex: 1;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .work-card-content h3 {
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 0.75rem;
        }

        .work-card-content p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .work-card-content a {
            color: #d4af37;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            transition: opacity 0.3s ease;
        }

        .work-card-content a:hover {
            opacity: 0.7;
        }

        footer {
            padding: 3rem 5%;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        footer p {
            font-size: 0.9rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.05em;
        }

        .animate-element {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .animate-element.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 灯箱 */
        .lightbox-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .lightbox-overlay.show {
            display: flex;
        }

        .lightbox-content {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }

        /* ========== 移动端层叠加固 ========== */
        @media (max-width: 768px) {
            /* 强制视频容器留在最底层，不接收任何点击 */
            #bg-video-wrapper {
                z-index: -999 !important;
                pointer-events: none !important;
            }

            /* 内容容器保持在上层，并可以正常交互 */
            #page-content {
                position: relative;
                z-index: 1 !important;
                pointer-events: auto !important;
            }

            /* 所有主要区块再次确保 z-index */
            nav, section, footer {
                position: relative;
                z-index: 1;
            }

            .nav-links {
                gap: 1rem;
            }

            .hero h1 {
                font-size: clamp(2rem, 8vw, 3.5rem);
            }

            .about-content,
            .works-grid {
                margin-left: 0;
            }

            .works-grid {
                grid-template-columns: 1fr;
            }

            .work-card {
                flex-direction: column;
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
            }

            .work-card-media {
                width: 100%;
                height: 160px;
                min-height: 160px;
            }

            .modal {
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
            }

            section {
                padding: 5rem 5%;
            }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            max-width: 540px;
            width: 90vw;
            opacity: 0;
            transition: opacity 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
        }

        .modal-overlay.show .modal {
            opacity: 1;
        }

        .modal ::-webkit-scrollbar {
            width: 4px;
        }

        .modal ::-webkit-scrollbar-track {
            background: transparent;
        }

        .modal ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
        }

        .modal ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        .modal h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 2rem;
            color: #ffffff;
        }

        /* 其余样式与前版一致，此处省略以保持简洁，实际代码中完整保留 */
        .drop-zone { width:100%; height:160px; border:2px dashed rgba(255,255,255,0.15); border-radius:8px; background:#1a1a1a; display:flex; justify-content:center; align-items:center; margin-bottom:0.75rem; transition:border-color 0.2s ease; cursor:pointer; }
        #musicDropZone { height:120px; }
        .drop-zone.dragover { border-color:#d4af37; }
        .drop-zone-text { font-size:15px; color:#aaa; text-align:center; }
        .drop-hint { font-size:12px; color:#666; text-align:center; margin-bottom:16px; }
        .url-input-row { display:flex; gap:8px; margin-bottom:16px; }
        .url-input-row input { flex:1; padding:10px 12px; border:1px solid rgba(255,255,255,0.1); border-radius:4px; background:rgba(255,255,255,0.05); color:#ffffff; font-size:14px; }
        .url-input-row input::placeholder { color:#666; }
        .url-input-row .modal-btn { padding:10px 20px; background:#ffffff; color:#000000; border:none; border-radius:4px; cursor:pointer; font-size:14px; transition:opacity 0.2s ease; }
        .url-input-row .modal-btn:hover { opacity:0.8; }
        .video-sound-control { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; gap:1rem; }
        .video-sound-control label:first-child { font-size:0.9rem; color:#888; white-space:nowrap; }
        .video-sound-control.enabled label:first-child { color:#ffffff; }
        .toggle-switch { position:relative; display:inline-block; width:50px; height:28px; cursor:pointer; }
        .toggle-switch input { opacity:0; width:0; height:0; }
        .toggle-switch .slider { position:absolute; top:0; left:0; right:0; bottom:0; background-color:#333; border-radius:14px; transition:background-color 0.2s ease; }
        .toggle-switch .slider::before { position:absolute; content:''; height:20px; width:20px; left:4px; bottom:4px; background-color:white; border-radius:50%; transition:transform 0.2s ease; }
        .toggle-switch input:checked + .slider { background-color:#d4af37; }
        .toggle-switch input:checked + .slider::before { transform:translateX(22px); }
        .toggle-switch.disabled { opacity:0.5; cursor:not-allowed; }
        .volume-control { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; gap:1rem; }
        .volume-control label { font-size:0.9rem; color:#aaa; white-space:nowrap; }
        .volume-control input[type="range"] { flex:1; height:4px; -webkit-appearance:none; appearance:none; background:linear-gradient(to right, #d4af37 var(--value, 50%), #2a2a2a var(--value, 50%)); border-radius:2px; outline:none; cursor:pointer; }
        .volume-control input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:16px; height:16px; background:#ffffff; border-radius:50%; cursor:pointer; transition:background 0.2s ease; margin-top:-6px; }
        .volume-control input[type="range"]::-webkit-slider-thumb:hover { background:#f0f0f0; }
        .modal-buttons { display:flex; gap:1rem; margin-top:1.5rem; }
        .modal-btn { flex:1; height:44px; padding:0 24px; border-radius:8px; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; transition:all 0.3s ease; border:none; }
        .modal-btn.reset { background:#ffffff; color:#000000; }
        .modal-btn.reset:hover { opacity:0.8; }
        .modal-btn.close { background:transparent; color:#ffffff; border:1px solid rgba(255,255,255,0.3); }
        .modal-btn.close:hover { background:#ffffff; color:#000000; }
        .modal-tabs { display:flex; gap:1.5rem; margin-bottom:1.5rem; border-bottom:1px solid rgba(255,255,255,0.1); }
        .modal-tab { padding-bottom:0.5rem; cursor:pointer; color:#888; font-size:0.95rem; position:relative; }
        .modal-tab.active { color:#ffffff; }
        .modal-tab.active::after { content:''; position:absolute; bottom:-1px; left:0; width:100%; height:2px; background:#d4af37; }
        .tab-content { max-height:400px; overflow-y:auto; }
        .text-edit-list { display:flex; flex-direction:column; gap:16px; }
        .text-edit-item { display:flex; flex-direction:column; gap:0.3rem; }
        .text-edit-item label { font-size:13px; color:#999; }
        .text-edit-item input, .text-edit-item textarea { width:100%; height:48px; padding:0 16px; background:#1e1e1e; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#ffffff; font-family:inherit; font-size:15px; transition:border-color 0.2s ease; }
        .text-edit-item textarea { height:auto; min-height:80px; padding:12px 16px; resize:vertical; }
        .text-edit-item input:focus, .text-edit-item textarea:focus { outline:none; border-color:#d4af37; }
        .login-modal { max-width:540px; }
        .login-modal input { width:100%; height:48px; padding:0 16px; background:#1e1e1e; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#ffffff; font-family:inherit; font-size:15px; font-weight:300; margin-bottom:0; transition:border-color 0.2s ease; }
        .login-modal input:focus { outline:none; border-color:#d4af37; }
        .login-modal input.error { border-color:#ff4444; }
        .modal-btn.confirm { background:#ffffff; color:#000000; }
        .modal-btn.confirm:hover { opacity:0.8; }
        .project-list { display:flex; flex-direction:column; gap:16px; margin-bottom:16px; max-height:400px; overflow-y:auto; }
        .project-card { background:#1e1e1e; border-radius:8px; padding:16px; position:relative; }
        .project-card .delete-btn { position:absolute; top:8px; right:8px; width:28px; height:28px; border:none; background:transparent; color:#ffffff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:color 0.2s ease; }
        .project-card .delete-btn:hover { color:#ff4444; }
        .project-card input, .project-card textarea { width:100%; padding:10px 12px; background:#2a2a2a; border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:#ffffff; font-family:inherit; font-size:14px; margin-bottom:8px; transition:border-color 0.2s ease; }
        .project-card textarea { height:80px; resize:vertical; }
        .project-card input:focus, .project-card textarea:focus { outline:none; border-color:#d4af37; }
        .project-media-section { margin-top:16px; }
        .project-media-section label { display:block; font-size:12px; color:#888; margin-bottom:8px; }
        .project-media-section input { padding:8px 12px; font-size:12px; }
        .delete-media-btn { position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.6); border:none; color:#fff; width:20px; height:20px; border-radius:50%; font-size:14px; line-height:1; cursor:pointer; display:none; z-index:5; }
        .project-media-dropzone { position:relative; display:flex; align-items:center; justify-content:center; }
        .project-media-dropzone.has-media .delete-media-btn { display:block; }
        .modal-btn.add-project { background:transparent; color:#ffffff; border:1px solid rgba(255,255,255,0.3); margin-bottom:16px; }
        .modal-btn.add-project:hover:not(:disabled) { background:#ffffff; color:#000000; }
        .modal-btn.add-project:disabled { opacity:0.5; cursor:not-allowed; }
        .works-section { display:block !important; visibility:visible !important; opacity:1 !important; }
        .works-section .works-grid, .works-section #projects-container { display:grid !important; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:24px; visibility:visible !important; opacity:1 !important; }
        .works-section h2 { color:#ffffff !important; font-size:24px; margin-bottom:24px; }
        .works-section .work-card { background:rgba(255,255,255,0.08) !important; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.08) !important; border-radius:12px !important; padding:32px 28px !important; color:#ffffff !important; opacity:1 !important; visibility:visible !important; min-height:200px !important; display:flex !important; flex-direction:column !important; justify-content:space-between !important; transition:transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease; }
        .works-section .work-card:hover { background:rgba(255,255,255,0.12) !important; transform:translateY(-4px); box-shadow:0 8px 30px rgba(212,175,55,0.1); }
        .works-section .work-card h3 { color:#ffffff !important; font-size:18px; margin-bottom:16px; }
        .works-section .work-card p { color:rgba(255,255,255,0.65) !important; font-size:14px; line-height:1.7; margin-bottom:20px; flex-grow:1; }
        .works-section .work-card a { color:#d4af37 !important; text-decoration:none !important; font-size:14px; }
        .works-section .work-card a:hover { text-decoration:underline !important; }
        @media (max-width:1024px) { .works-section .works-grid, .works-section #projects-container { grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); } .works-section .work-card { min-height:180px !important; } }
        @media (max-width:768px) { .works-section .works-grid, .works-section #projects-container { grid-template-columns:1fr; } }
        .works-section.hidden { display:none; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>
    <div class="bg-container" id="bgContainer"></div>
    <div id="bg-video-wrapper" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -999; pointer-events: none; overflow: hidden; background: #0a0a0a;">
        <video id="bgVideo" src="https://assets.mixkit.co/videos/preview/mixkit-abstract-light-particles-loop-24979-large.mp4" autoplay muted loop playsinline preload="auto" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none;"></video>
        <div id="bgOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); pointer-events: none; z-index: 1;"></div>
    </div>
    <div id="page-content" style="position: relative; z-index: 1; pointer-events: auto;">
        <nav id="navbar" style="position: relative; z-index: 2;">
            <div class="logo">黑红8</div>
            <div class="nav-links">
                <a href="#about">关于</a>
                <a href="#works">作品</a>
                <a href="#" id="developerLink">开发者</a>
            </div>
        </nav>

        <section class="hero" style="position: relative; z-index: 1;">
            <h1>创造有意义的数字体验</h1>
            <p>我是Godme，一个专注于简约与细节的创作者</p>
            <a href="#works" class="btn">查看作品</a>
        </section>

        <section id="about" class="about-section" style="position: relative; z-index: 1;">
            <div class="section-content about-content animate-element">
                <h2>关于我</h2>
                <p>我相信设计的力量在于简约。每一个像素、每一条线条都应该有其存在的意义。</p>
                <p>在数字世界中，我致力于创造既美观又实用的体验，让用户与技术之间的互动变得自然而流畅。</p>
            </div>
        </section>

        <section id="works" class="works-section" style="position: relative; z-index: 1;">
            <div class="section-content works-grid">
                <h2>精选项目</h2>
                <div id="projects-container"></div>
            </div>
        </section>

        <footer style="position: relative; z-index: 1;">
            <p>© 2026 Godme. 简约至极。</p>
        </footer>

        <div class="lightbox-overlay" id="lightbox">
            <img class="lightbox-content" id="lightboxImg" src="" alt="预览图片">
        </div>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-tabs">
                    <span class="modal-tab active" data-tab="background">背景</span>
                    <span class="modal-tab" data-tab="text">文字</span>
                    <span class="modal-tab" data-tab="projects">项目</span>
                    <span class="modal-tab" data-tab="music">音乐</span>
                </div>
                <div class="tab-content" id="tabBackground">
                    <h3>更换背景</h3>
                    <div class="drop-zone" id="dropZone">
                        <div class="drop-zone-text">将图片或视频拖到这里</div>
                    </div>
                    <div class="drop-hint">支持 JPG、PNG、GIF、MP4、WebM</div>
                    <div class="url-input-row">
                        <input type="text" id="bgUrlInput" placeholder="输入图片或视频链接">
                        <button class="modal-btn" id="applyBgUrlBtn">应用</button>
                    </div>
                    <div class="video-sound-control">
                        <label>视频声音</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="videoSoundToggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="modal-buttons">
                    <button class="modal-btn close" id="closeBtn">关闭</button>
                    <button class="modal-btn reset" id="resetBtn">恢复默认背景</button>
                </div>
            </div>
            <div class="tab-content" id="tabText" style="display:none;">

    <script>
        // ========== 图片压缩函数 ==========
        function compressImageToDataUrl(file, maxWidth, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = function() { resolve(e.target.result); };
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ========== 视频去重 ==========
        (function() {
            const videos = document.querySelectorAll('video');
            const bgVideo = document.getElementById('bgVideo');
            if (bgVideo) {
                videos.forEach(video => { if (video !== bgVideo) video.remove(); });
            }
        })();

        // ========== Firebase 初始化 ==========
        const firebaseConfig = {
            apiKey: "AIzaSyAjQTDH8-Xv2c-5h_seYxCdDAwRaMjor5w",

        // ========== 导航栏滚动效果 ==========
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) navbar.classList.add('scrolled');
            else navbar.classList.remove('scrolled');
        });

        // ========== 滚动动画 ==========
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.2 });
        document.querySelectorAll('.animate-element').forEach(el => observer.observe(el));

        // ========== 背景管理 ==========
        const defaultVideoUrl = 'https://assets.mixkit.co/videos/preview/mixkit-abstract-light-particles-loop-24979-large.mp4';
        const videoWrapper = document.getElementById('bg-video-wrapper');
        const bgVideo = document.getElementById('bgVideo');

        function tryPlayVideo() {
            if (!bgVideo.src) return;
            bgVideo.play().catch(() => {
                const resume = () => {
                    bgVideo.play().catch(() => {});
                    document.removeEventListener('touchstart', resume);
                    document.removeEventListener('click', resume);
                };
                document.addEventListener('touchstart', resume, { once: true });
                document.addEventListener('click', resume, { once: true });
            });
        }
        bgVideo.addEventListener('ended', () => bgVideo.play().catch(() => {}));
        tryPlayVideo();
        if (bgVideo.readyState < 2) {
            bgVideo.addEventListener('canplay', function onCanPlay() {
                tryPlayVideo();
                bgVideo.removeEventListener('canplay', onCanPlay);
            }, { once: true });
        }

        async function loadBackgroundFromCloud() {
            try { const snap = await db.ref('siteData/background').once('value'); return snap.val() || null; } catch (e) { return null; }
        }
        async function saveBackgroundToCloud(dataUrl, type) { if (!isAuthenticated) return; try { await db.ref('siteData/background').set({ dataUrl, type }); } catch (e) {} }
        async function saveBackgroundUrlToCloud(url, type) { if (!isAuthenticated) return; try { await db.ref('siteData/background').set({ url, type }); } catch (e) {} }
        async function clearBackgroundFromCloud() { if (!isAuthenticated) return; try { await db.ref('siteData/background').remove(); } catch (e) {} }
        function applyBackground(bgData) {
            if (!bgData) return;
            if (bgData.type === 'image') {
                const src = bgData.url || bgData.dataUrl;
                if (src) {
                    document.body.style.backgroundImage = `url(${src})`;
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundPosition = 'center';
                    document.body.style.backgroundRepeat = 'no-repeat';
                    document.body.style.backgroundAttachment = 'fixed';
                    videoWrapper.style.display = 'none';
                }
            } else if (bgData.type === 'video') {
                const src = bgData.url || bgData.dataUrl;
                if (src) {
                    document.body.style.backgroundImage = 'none';
                    videoWrapper.style.display = 'block';
                    bgVideo.src = src;
                    bgVideo.load();
                    tryPlayVideo();
                }
            }
        }
        function resetToDefaultBackground() {
            document.body.style.backgroundImage = 'none';
            videoWrapper.style.display = 'block';
            bgVideo.src = defaultVideoUrl;
            bgVideo.load();
            tryPlayVideo();
        }
        (async () => {
            const bgData = await loadBackgroundFromCloud();
            if (bgData && (bgData.url || bgData.dataUrl)) applyBackground(bgData);
            else resetToDefaultBackground();
        })();
        db.ref('siteData/background').on('value', (snap) => {
            const bgData = snap.val();
            if (bgData && (bgData.url || bgData.dataUrl)) applyBackground(bgData);
        });
